spring.main.banner-mode=off

# One HTTP endpoint: http://localhost:8080/mcp (MCP over Streamable HTTP).
# Bound to 127.0.0.1, so only programs on this machine can reach it.
spring.main.web-application-type=servlet
server.address=127.0.0.1
server.port=${MINI_JIRA_PORT:8080}

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=mini-jira
spring.ai.mcp.server.version=1.0.0

mini-jira.data.path=${MINI_JIRA_DATA:data/issues.json}
